<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Impact Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b3d2e, #1b5e20);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #14532d;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-box {
            background: #f3f8f4;
            padding: 18px;
            border-radius: 14px;
        }

        label {
            display: block;
            color: #14532d;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5cf;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #22c55e;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        #result {
            display: none;
            margin-top: 30px;
        }

        .score {
            text-align: center;
            background: #ecfdf5;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .score h2 {
            color: #166534;
            font-size: 28px;
        }

        .score p {
            margin-top: 8px;
            color: #555;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: #f8faf9;
            padding: 20px;
            text-align: center;
            border-radius: 14px;
        }

        .card h3 {
            color: #166534;
            font-size: 25px;
        }

        .card p {
            color: #666;
            margin-top: 5px;
        }

        .suggestion {
            background: #fff7ed;
            padding: 20px;
            border-radius: 14px;
        }

        .suggestion h3 {
            color: #c2410c;
            margin-bottom: 10px;
        }

        .suggestion p {
            color: #555;
            line-height: 1.6;
        }

        @media (max-width: 650px) {
            .form-grid,
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 22px;
            }

            .header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌱 Eco Impact Calculator</h1>
        <p>Estimate your daily environmental impact</p>
    </div>

    <div class="form-grid">

        <div class="input-box">
            <label>🚗 Car Travel (km/day)</label>
            <input type="number" id="car" min="0" placeholder="Example: 10">
        </div>

        <div class="input-box">
            <label>🚌 Public Transport (km/day)</label>
            <input type="number" id="transport" min="0" placeholder="Example: 5">
        </div>

        <div class="input-box">
            <label>💡 Electricity (kWh/day)</label>
            <input type="number" id="electricity" min="0" placeholder="Example: 8">
        </div>

        <div class="input-box">
            <label>🍽️ Meat Meals (per day)</label>
            <input type="number" id="meat" min="0" placeholder="Example: 1">
        </div>

        <div class="input-box">
            <label>🌳 Trees Planted</label>
            <input type="number" id="trees" min="0" placeholder="Example: 2">
        </div>

    </div>

    <button onclick="calculateImpact()">Calculate My Impact 🌍</button>

    <div id="result">

        <div class="score">
            <h2 id="total">0 kg CO₂</h2>
            <p id="level">Your estimated daily carbon footprint</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3 id="carImpact">0</h3>
                <p>Car CO₂</p>
            </div>

            <div class="card">
                <h3 id="electricImpact">0</h3>
                <p>Electricity CO₂</p>
            </div>

            <div class="card">
                <h3 id="foodImpact">0</h3>
                <p>Food CO₂</p>
            </div>

        </div>

        <div class="suggestion">
            <h3>💡 Eco Suggestion</h3>
            <p id="suggestionText"></p>
        </div>

    </div>

</div>

<script>
function calculateImpact() {

    let car = Number(document.getElementById("car").value) || 0;
    let transport = Number(document.getElementById("transport").value) || 0;
    let electricity = Number(document.getElementById("electricity").value) || 0;
    let meat = Number(document.getElementById("meat").value) || 0;
    let trees = Number(document.getElementById("trees").value) || 0;

    // Approximate emission factors
    let carImpact = car * 0.21;
    let transportImpact = transport * 0.08;
    let electricityImpact = electricity * 0.42;
    let foodImpact = meat * 2.5;

    // Trees offset some CO2
    let treeOffset = trees * 0.5;

    let totalImpact =
        carImpact +
        transportImpact +
        electricityImpact +
        foodImpact -
        treeOffset;

    if (totalImpact < 0) {
        totalImpact = 0;
    }

    document.getElementById("total").innerText =
        totalImpact.toFixed(2) + " kg CO₂";

    document.getElementById("carImpact").innerText =
        carImpact.toFixed(2) + " kg";

    document.getElementById("electricImpact").innerText =
        electricityImpact.toFixed(2) + " kg";

    document.getElementById("foodImpact").innerText =
        foodImpact.toFixed(2) + " kg";

    let level;
    let suggestion;

    if (totalImpact <= 5) {
        level = "🌿 Low Impact — Great job!";
        suggestion = "Your estimated impact is relatively low. Keep using sustainable transport, saving electricity and protecting nature.";
    } 
    else if (totalImpact <= 12) {
        level = "🌱 Moderate Impact — You can improve!";
        suggestion = "Try reducing car travel, using public transport and lowering unnecessary electricity consumption.";
    } 
    else {
        level = "🌍 High Impact — Time for greener choices!";
        suggestion = "Consider using public transport, reducing meat consumption and improving energy efficiency.";
    }

    document.getElementById("level").innerText = level;
    document.getElementById("suggestionText").innerText = suggestion;

    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
